name: "Bug Report"
description: "Report a bug or unexpected behavior"
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in the details below.

  - type: dropdown
    id: linthtml-version
    attributes:
      label: LintHTML version
      options:
        - 0.10.x
        - 0.9.x
        - Other
    validations:
      required: true

  - type: dropdown
    id: node-version
    attributes:
      label: Node.js version
      options:
        - 24.x
        - 22.x
        - 20.x
        - 18.x
        - Other
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: e.g., 2.0.0
    validations:
      required: true

  - type: textarea
    id: error-output
    attributes:
      label: Error output
      description: Paste the linter output from terminal
      placeholder: |
        File: test/index.html
        8:3  error  The <section> element must contain...
    validations:
      required: true

  - type: textarea
    id: code-sample
    attributes:
      label: Code sample
      description: HTML code that triggers the issue
      render: html
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs Actual
      description: What should happen vs what happens
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Only if not obvious from above
    validations:
      required: false
